- id: periodo-fora-do-intervalo
  turns:
    - user: "Quais foram os principais produtos exportados pelo Brasil em 1980?"
      action: clarify
      tables: []
      temporal: none
      notes: "1980 é anterior ao início da cobertura da série de comércio exterior (começa no fim dos anos 1990). Deve consultar get_table_details, constatar que 1980 está fora de [period_start, period_end], informar o período disponível e perguntar como prosseguir — SEM consultar silenciosamente outro ano. Testa a regra de período fora do intervalo."

- id: ibge-populacao
  turns:
    - user: "Qual é a população total do Brasil?"
      action: query
      tables:
        - basedosdados.br_ibge_populacao.brasil
      temporal: latest
      reference_sql: |
        SELECT ano, populacao
        FROM `basedosdados.br_ibge_populacao.brasil`
        WHERE ano = 2025 -- period_end (cobertura anual 1991-2025); atualizar quando avançar
      notes: "Fonte IBGE (cobre a lacuna de órgão no gold). Sem período informado -> mais recente (period_end anual, granularidade ano). Tabela de uma linha por ano — consulta de uma tabela só."

    - user: "E como ela se distribui entre os estados nesse ano?"
      action: query
      tables:
        - basedosdados.br_ibge_populacao.uf
        - basedosdados.br_bd_diretorios_brasil.uf
      temporal: match_previous
      reference_sql: |
        SELECT
          t2.nome AS estado,
          t1.sigla_uf,
          t1.populacao
        FROM `basedosdados.br_ibge_populacao.uf` AS t1
        JOIN `basedosdados.br_bd_diretorios_brasil.uf` AS t2
          ON t1.sigla_uf = t2.sigla -- diretório usa `sigla` (não `sigla_uf`)
        WHERE t1.ano = 2025
        ORDER BY t1.populacao DESC
      notes: "Mesmo ano do turno anterior (match_previous). sigla_uf é codificada (reference_table_id -> diretório de UF): deve fazer JOIN para exibir o nome do estado. Testa reescopo Brasil->UF e tradução de coluna codificada."
