- id: cnes-farmacias
  turns:
    - user: "Quantas farmácias existem no município de Campinas?"
      action: query
      tables:
        - basedosdados.br_ms_cnes.estabelecimento
        - basedosdados.br_bd_diretorios_brasil.municipio
      temporal: latest
      reference_sql: |
        SELECT
            COUNT(DISTINCT id_estabelecimento_cnes) as total_farmacias
        FROM `basedosdados.br_ms_cnes.estabelecimento`
        WHERE id_municipio = '3509502' -- ID de Campinas/SP
          AND tipo_unidade = '43' -- Código para 'farmacia'
          AND ano = 2026
          AND mes = 5
      notes: "Tabela mensal com period_end '2026-05' e SEM guia de uso. Testa se o agente usa o período mais recente (period_end) em vez de assumir um ano anterior do seu conhecimento prévio."

